name: shambadoc
description: AI-Powered Crop Disease Diagnosis App for Kenyan Smallholder Farmers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Camera & image
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.1.3

  # AI
  tflite_flutter: ^0.12.1

  # Storage
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Maps & location
  google_maps_flutter: ^2.6.0
  geolocator: ^10.1.0

  # Networking
  http: ^1.6.0
  connectivity_plus: ^6.0.0

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.2.5
  permission_handler: ^11.3.0
  sqflite_common_ffi: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/models/
    - assets/images/
    - assets/icons/
